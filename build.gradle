plugins {
	id("me.modmuss50.mod-publish-plugin") version "2.2.1"
	id('fabric-loom') version '1.14.10'
	id('maven-publish')
}

def supportedMinecraftVersions = ["1.20.1", "1.21.1", "1.21.11"]
def targetMinecraft = providers.gradleProperty("minecraft_version").get()
if (!(targetMinecraft in supportedMinecraftVersions)) {
    throw new GradleException("Unsupported minecraft_version '${targetMinecraft}'. Choose ${supportedMinecraftVersions.join(', ')}")
}
def targetProperties = new Properties()
rootProject.file("versions/${targetMinecraft}/gradle.properties").withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key.toString(), value.toString()) }
def targetJava = project.java_version.toInteger()
layout.buildDirectory = layout.projectDirectory.dir("build/${targetMinecraft}")
sourceSets.main.java.srcDir("versions/${targetMinecraft}/src/main/java")

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name + "-mc" + project.minecraft_version
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.mod_config}") { //For config
		exclude(group: "net.fabricmc.fabric-api")
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${project.mod_config}"

	modImplementation "com.terraformersmc:modmenu:${project.mod_menu}"
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "autopath-tests"
		enableClientGameTests = false
	}
}

loom {
    runs {
        client { runDir "run/${targetMinecraft}/client" }
        server { runDir "run/${targetMinecraft}/server" }
        gameTest { runDir "build/${targetMinecraft}/run/gameTest" }
    }
}

sourceSets.gametest.java.setSrcDirs(["versions/${targetMinecraft}/src/gametest/java"])
sourceSets.gametest.resources.setSrcDirs(["src/gametest/resources"])

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "java_version", targetJava

	filesMatching(["fabric.mod.json", "autopath.mixins.json"]) {
		expand "version": project.version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version,
			"java_version": targetJava
	}
    if (targetMinecraft != "1.21.11") {
        exclude "assets/autopath/items/**"
    }
    eachFile { details ->
        if (targetMinecraft == "1.20.1") {
            details.path = details.path.replace("/tags/block/", "/tags/blocks/")
            details.path = details.path.replace("/recipe/", "/recipes/").replace("/loot_table/", "/loot_tables/")
        }
    }
    doLast {
        if (targetMinecraft != "1.21.11") {
            def recipeDir = new File(destinationDir, "data/autopath/${targetMinecraft == '1.20.1' ? 'recipes' : 'recipe'}")
            fileTree(recipeDir).matching { include "*.json" }.each { recipe ->
                def data = new groovy.json.JsonSlurper().parse(recipe)
                data.ingredients = data.ingredients.collect { [item: it] }
                if (targetMinecraft == "1.20.1") data.result.item = data.result.remove("id")
                recipe.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + "\n"
            }
        }
        if (targetMinecraft == "1.20.1") {
            fileTree(new File(destinationDir, "data/autopath/loot_tables")).matching { include "**/*.json" }.each { loot ->
                def data = new groovy.json.JsonSlurper().parse(loot)
                def predicate = data.pools[0].entries[0].children[0].conditions[0].predicate
                def enchantments = predicate.remove("predicates")["minecraft:enchantments"]
                enchantments.each { it.enchantment = it.remove("enchantments") }
                predicate.enchantments = enchantments
                loot.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + "\n"
            }
        }
    }

}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.21 use java 21
	it.options.release = targetJava
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	sourceCompatibility = JavaVersion.toVersion(targetJava)
	targetCompatibility = JavaVersion.toVersion(targetJava)

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()

			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(remapSourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}

// Publishing is separate from `build`; API tokens stay in environment variables.
def publishTarget = providers.gradleProperty("publish_target").orElse("both").get()
def releaseType = providers.gradleProperty("release_type").orElse("stable").get()
if (!(publishTarget in ["both", "curseforge", "modrinth"])) {
    throw new GradleException("publish_target must be both, curseforge, or modrinth")
}
if (!(releaseType in ["stable", "beta", "alpha"])) {
    throw new GradleException("release_type must be stable, beta, or alpha")
}

publishMods {
    file = tasks.remapJar.archiveFile
    version = "${project.mod_version}+mc${targetMinecraft}"
    displayName = "Automatic Path ${project.mod_version} — Minecraft ${project.minecraft_version}"
    changelog = providers.fileContents(layout.projectDirectory.file("changelog.md")).asText
    type = me.modmuss50.mpp.ReleaseType.valueOf(releaseType.toUpperCase(java.util.Locale.ROOT))
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("publish_dry_run").map { it.toBoolean() }.orElse(true)

    if (publishTarget in ["both", "curseforge"]) {
        curseforge {
            projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID").orElse("460405")
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            minecraftVersions.add(project.minecraft_version)
            javaVersions.add(JavaVersion.toVersion(targetJava))
            client = true
            server = true
            requires("fabric-api")
            embeds("cloth-config")
            optional("modmenu")
        }
    }
    if (publishTarget in ["both", "modrinth"]) {
        modrinth {
            projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            minecraftVersions.add(project.minecraft_version)
            requires("fabric-api")
            embeds("cloth-config")
            optional("modmenu")
        }
    }
}
