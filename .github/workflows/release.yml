name: Publish mod

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Destination
        type: choice
        options: [both, curseforge, modrinth]
        default: both
      release_type:
        description: Release channel
        type: choice
        options: [stable, beta, alpha]
        default: stable
      dry_run:
        description: Preview upload metadata without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-mod
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_publish_target: ${{ inputs.platform }}
      ORG_GRADLE_PROJECT_release_type: ${{ inputs.release_type }}
      ORG_GRADLE_PROJECT_publish_dry_run: ${{ inputs.dry_run }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || '460405' }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || (inputs.dry_run && 'preview-project') || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and run game tests
        run: ./gradlew build
      - name: Publish selected destinations
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          target = os.environ['ORG_GRADLE_PROJECT_publish_target']
          dry_run = os.environ['ORG_GRADLE_PROJECT_publish_dry_run'] == 'true'
          required = []
          if target in ('both', 'modrinth'):
              required.append('MODRINTH_PROJECT_ID')
          if not dry_run:
              if target in ('both', 'curseforge'):
                  required.append('CURSEFORGE_TOKEN')
              if target in ('both', 'modrinth'):
                  required.append('MODRINTH_TOKEN')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Configure these GitHub secrets/variables: ' + ', '.join(missing))
          PY
          ./gradlew publishMods
      - name: Save release JAR and preview metadata
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: |
            build/libs/*.jar
            build/publishMods/**
          if-no-files-found: error
